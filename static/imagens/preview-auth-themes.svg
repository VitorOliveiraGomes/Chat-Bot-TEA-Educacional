<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <rect width="1200" height="540" rx="16" fill="#12161f" stroke="#2e384b" stroke-width="2"/>

  <!-- Card Login (Esquerda) -->
  <rect x="110" y="55" width="440" height="430" rx="16" fill="#1a202c" stroke="#2e384b" stroke-width="1.5"/>
  <rect x="308" y="85" width="44" height="44" rx="8" fill="#3b82f6"/>
  <text x="330" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">TEA</text>

  <text x="330" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#edf2f7" text-anchor="middle">Entrar no Chat TEA</text>
  <text x="330" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a0aec0" text-anchor="middle">Ambiente de estudos calmo e sem distrações visuais.</text>

  <text x="146" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#a0aec0">Nome de usuário</text>
  <rect x="146" y="234" width="368" height="42" rx="8" fill="#232b3a" stroke="#2e384b"/>
  <text x="162" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#edf2f7">estudante_lucas</text>

  <text x="146" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#a0aec0">Senha</text>
  <rect x="146" y="314" width="368" height="42" rx="8" fill="#232b3a" stroke="#2e384b"/>
  <text x="162" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#edf2f7">••••••••••</text>

  <rect x="146" y="378" width="368" height="44" rx="8" fill="#3b82f6"/>
  <text x="330" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Entrar</text>

  <text x="330" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a0aec0" text-anchor="middle">Ainda não possui uma conta? <tspan fill="#3b82f6" font-weight="600">Criar conta</tspan></text>

  <!-- Card Tema Claro (Direita) -->
  <rect x="650" y="55" width="440" height="430" rx="16" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <rect x="848" y="85" width="44" height="44" rx="8" fill="#2563eb"/>
  <text x="870" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">TEA</text>

  <text x="870" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a202c" text-anchor="middle">Criar Conta (Tema Claro)</text>
  <text x="870" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568" text-anchor="middle">Cadastre-se para salvar seu histórico na nuvem.</text>

  <text x="686" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5568">Escolha um nome de usuário</text>
  <rect x="686" y="234" width="368" height="42" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="702" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a202c">novo_estudante</text>

  <text x="686" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5568">Crie uma senha (mínimo de 8 caracteres)</text>
  <rect x="686" y="314" width="368" height="42" rx="8" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="702" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1a202c">••••••••••</text>

  <rect x="686" y="378" width="368" height="44" rx="8" fill="#2563eb"/>
  <text x="870" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Cadastrar e Entrar</text>

  <text x="870" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5568" text-anchor="middle">Já possui uma conta? <tspan fill="#2563eb" font-weight="600">Fazer login</tspan></text>
</svg>
