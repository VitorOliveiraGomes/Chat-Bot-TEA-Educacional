<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — Chat TEA</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='imagens/logo.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="tema-escuro auth-page">
  <main class="auth-container">
    <div class="auth-card">
      <img
        src="{{ url_for('static', filename='imagens/logo.png') }}"
        alt="Logo Chat TEA"
        class="auth-logo-img"
      />
      <h1 class="auth-title">Criar Conta</h1>
      <p class="auth-description">
        Cadastre-se para salvar seu histórico de estudos na nuvem.
      </p>

      {% if error %}
      <div class="alert-error" role="alert">{{ error }}</div>
      {% endif %}
      <div id="auth-alert" class="alert-error" role="alert" hidden></div>

      <form id="register-form" method="POST" action="{{ url_for('register') }}" class="auth-form">
        <div class="field-group">
          <label for="username">Escolha um nome de usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ex: estudante_lucas"
            minlength="3"
            maxlength="40"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="field-group">
          <label for="password">Crie uma senha (mínimo de 8 caracteres)</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo de 8 caracteres"
            minlength="8"
            autocomplete="new-password"
            required
          />
        </div>

        <button type="submit" class="btn-primary btn-block" id="btn-submit">
          Cadastrar e Entrar
        </button>
      </form>

      <p class="auth-switch">
        Já possui uma conta?
        <a href="{{ url_for('login') }}">Fazer login</a>
      </p>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
