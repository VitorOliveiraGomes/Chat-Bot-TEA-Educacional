<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Chat TEA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="tema-escuro auth-page">
  <main class="auth-container">
    <div class="auth-card">
      <div class="brand-logo auth-logo" aria-hidden="true">TEA</div>
      <h1 class="auth-title">Entrar no Chat TEA</h1>
      <p class="auth-description">
        Ambiente de estudos estruturado, calmo e sem distrações visuais.
      </p>

      {% if error %}
      <div class="alert-error" role="alert">{{ error }}</div>
      {% endif %}
      <div id="auth-alert" class="alert-error" role="alert" hidden></div>

      <form id="login-form" method="POST" action="{{ url_for('login') }}" class="auth-form">
        <div class="field-group">
          <label for="username">Nome de usuário</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Digite seu usuário"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="field-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            minlength="8"
            required
          />
        </div>

        <button type="submit" class="btn-primary btn-block" id="btn-submit">
          Entrar
        </button>
      </form>

      <p class="auth-switch">
        Ainda não possui uma conta?
        <a href="{{ url_for('register') }}">Criar conta</a>
      </p>
    </div>
  </main>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
